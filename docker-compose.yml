services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gst_agent
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports: ["3307:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/gst_agent?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      CACHE_TYPE: redis
      TOKEN_STORE: redis
      REDIS_HEALTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (base64, 32+ bytes)}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: http://localhost:8081
    volumes: [uploads:/data/uploads]
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8081:80"]

volumes:
  mysql-data:
  uploads:
