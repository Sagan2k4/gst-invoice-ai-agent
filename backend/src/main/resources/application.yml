server:
  port: ${PORT:8080}

spring:
  application:
    name: gst-invoice-agent
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gst_agent?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    # "redis" in docker/prod, "simple" (in-memory) for a laptop without Redis
    type: ${CACHE_TYPE:simple}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

app:
  jwt:
    # Base64-encoded 256-bit secret. Override in every real environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTI1Ni1iaXRzIQ==}
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  token-store: ${TOKEN_STORE:memory}   # memory | redis
  ai:
    # openai = real vision extraction; mock = deterministic sample data (no API key needed)
    provider: ${AI_PROVIDER:mock}
    max-correction-attempts: 1
  storage:
    dir: ${STORAGE_DIR:./uploads}
  validation:
    # tolerance (in rupees) for rounding differences on tax/total checks
    amount-tolerance: 1.00
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
